# Copiloto Rocket Tec — proxy hacia la API de Claude (ver LEEME.md)
name = "rpl-copiloto"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Una sola dirección pública: https://rpl-copiloto.<subdominio>.workers.dev (sin URLs de vista previa).
workers_dev = true
preview_urls = false

[vars]
# Páginas que pueden usar el copiloto (separadas por comas, coincidencia exacta).
ALLOWED_ORIGINS = "https://echucuan.github.io,http://localhost:5174"
# Modelo: claude-haiku-5-5 (económico, recomendado para el grupo) o claude-sonnet-5-5 / claude-opus-5-5.
MODEL = "claude-haiku-5-5"
# Respuestas cortas: tope de tokens por respuesta y esfuerzo de razonamiento (low | medium | high).
MAX_TOKENS = "2000"
EFFORT = "low"
# Grupos que pueden usar el copiloto (deben coincidir con COPILOT_GROUPS en src/ui/copilot/groups.ts de la app).
GROUPS = "501,502,503,504"
# Preguntas por día: por alumno (cada navegador), por cada grupo y en total.
DAILY_PER_STUDENT = "40"
DAILY_PER_GROUP = "900"
DAILY_TOTAL = "3000"

# Máximo de preguntas por minuto por alumno (cada navegador). period solo puede ser 10 o 60 segundos.
[[ratelimits]]
name = "PER_MINUTE"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Tope por minuto por red (IP): todo un salón comparte una. Súbelo si un salón lleno ve "muy ocupado en tu red".
[[ratelimits]]
name = "PER_IP"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Contadores diarios. Crea el namespace con: npx wrangler kv namespace create QUOTA
# y pega aquí el id que te dé (en local funciona con cualquier valor).
[[kv_namespaces]]
binding = "QUOTA"
id = "59b4a3adaa8749dbaba9a8c86342e06d"
